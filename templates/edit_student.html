{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}
{% block nav_students %}active{% endblock %}

{% block page_title %}Edit Student{% endblock %}
{% block page_subtitle %}Update an existing student record{% endblock %}

{% block content %}
<div class="page-card" style="max-width:720px;">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group full">
                <label>Name</label>
                <input type="text" name="name" value="{{ student.name }}" required>
            </div>

            <div class="form-group">
                <label>GPA</label>
                <input type="number" step="0.01" name="gpa" value="{{ student.gpa }}" required>
            </div>

            <div class="form-group">
                <label>Attendance (%)</label>
                <input type="number" step="0.01" name="attendance" value="{{ student.attendance }}" required>
            </div>

            <div class="form-group full">
                <label>Assignments Completed</label>
                <input type="number" name="assignments_completed" value="{{ student.assignments_completed }}" required>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary"><i class="ph ph-floppy-disk"></i> Update Student</button>
            <a href="{{ url_for('students') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
