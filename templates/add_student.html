{% extends "base.html" %}

{% block title %}Add Student{% endblock %}
{% block nav_students %}active{% endblock %}

{% block page_title %}Add New Student{% endblock %}
{% block page_subtitle %}Create a new student record{% endblock %}

{% block content %}
<div class="page-card" style="max-width:720px;">
    <form action="{{ url_for('add_student') }}" method="POST">
        <div class="form-grid">
            <div class="form-group full">
                <label>Student Name</label>
                <input type="text" name="name" placeholder="Enter student name" required>
            </div>

            <div class="form-group">
                <label>GPA</label>
                <input type="number" step="0.01" name="gpa" placeholder="e.g. 3.5" required>
            </div>

            <div class="form-group">
                <label>Attendance (%)</label>
                <input type="number" step="0.01" name="attendance" placeholder="e.g. 90" required>
            </div>

            <div class="form-group full">
                <label>Assignments Completed</label>
                <input type="number" name="assignments_completed" placeholder="e.g. 40" required>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary"><i class="ph ph-floppy-disk"></i> Save Student</button>
            <a href="{{ url_for('students') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
